<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — OnTyme</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <a href="index.html" class="logo" style="display:flex"><img src="assets/logo.svg" alt="OnTyme"></a>
    <h1 id="authHeading">Welcome back</h1>
    <p class="sub" id="authSub">Sign in to see your bookings.</p>

    <button type="button" class="btn-google" id="googleBtn">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 01-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.33A9 9 0 009 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 013.68 9c0-.59.1-1.17.27-1.7V4.97H.98A9 9 0 000 9c0 1.45.35 2.83.98 4.03l2.97-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 00.98 4.97l2.97 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
      Continue with Google
    </button>

    <div class="auth-divider">or</div>

    <div class="auth-tabs">
      <button type="button" class="auth-tab active" data-mode="signin">Sign in</button>
      <button type="button" class="auth-tab" data-mode="signup">Create account</button>
    </div>

    <form id="emailForm">
      <div class="field" style="margin-bottom:16px">
        <label for="email">Email</label>
        <input id="email" type="email" required autocomplete="email">
      </div>
      <div class="field" style="margin-bottom:8px">
        <label for="password">Password</label>
        <input id="password" type="password" required autocomplete="current-password" minlength="6">
      </div>
      <a href="#" class="forgot-link" id="forgotLink">Forgot password?</a>
      <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn" style="margin-top:20px">Sign in</button>
    </form>

    <div id="messageBox"></div>
  </div>
</div>

<script type="module">
  import {
    auth, googleProvider, onAuthStateChanged, signInWithPopup,
    signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail
  } from './firebase.js';

  const params = new URLSearchParams(window.location.search);
  const next = params.get('next') || 'index.html';

  onAuthStateChanged(auth, function (user) {
    if (user) window.location.href = next;
  });

  const heading = document.getElementById('authHeading');
  const sub = document.getElementById('authSub');
  const submitBtn = document.getElementById('submitBtn');
  const messageBox = document.getElementById('messageBox');
  const tabs = document.querySelectorAll('.auth-tab');
  let mode = 'signin';

  function showMessage(text, type) {
    messageBox.innerHTML = '<div class="auth-' + (type === 'error' ? 'error' : 'message') + '">' + text + '</div>';
  }

  function setMode(next) {
    mode = next;
    tabs.forEach(function (t) { t.classList.toggle('active', t.getAttribute('data-mode') === mode); });
    if (mode === 'signup') {
      heading.textContent = 'Create your account';
      sub.textContent = 'Book rides and track your trip history.';
      submitBtn.textContent = 'Create account';
    } else {
      heading.textContent = 'Welcome back';
      sub.textContent = 'Sign in to see your bookings.';
      submitBtn.textContent = 'Sign in';
    }
    messageBox.innerHTML = '';
  }

  tabs.forEach(function (tab) {
    tab.addEventListener('click', function () { setMode(tab.getAttribute('data-mode')); });
  });

  document.getElementById('googleBtn').addEventListener('click', function () {
    signInWithPopup(auth, googleProvider).catch(function (err) {
      showMessage(err.message, 'error');
    });
  });

  document.getElementById('emailForm').addEventListener('submit', function (e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const action = mode === 'signup' ? createUserWithEmailAndPassword : signInWithEmailAndPassword;
    action(auth, email, password).catch(function (err) {
      showMessage(err.message, 'error');
    });
  });

  document.getElementById('forgotLink').addEventListener('click', function (e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    if (!email) {
      showMessage('Enter your email above first, then click "Forgot password?" again.', 'error');
      return;
    }
    sendPasswordResetEmail(auth, email).then(function () {
      showMessage('Password reset email sent to ' + email + '.', 'message');
    }).catch(function (err) {
      showMessage(err.message, 'error');
    });
  });
</script>
</body>
</html>
